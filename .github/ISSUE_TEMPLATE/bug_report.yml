name: Bug report
description: Report a reproducible Ezra Mail problem using sanitized evidence.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve Ezra Mail. Never include live mail, credentials, account identifiers, private hostnames, or private IP addresses.
  - type: input
    id: version
    attributes:
      label: Ezra Mail version or revision
      placeholder: v0.7.4 or a Git commit
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        - Ubuntu self-hosted server
        - Windows development or test installation
        - Other private installation
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Browser and operating system
      placeholder: Edge 150 on Windows 11
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Use synthetic or redacted examples only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Paste only logs or screenshots you have checked for private information.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed live mail, credentials, account identifiers, private hostnames, and private IP addresses.
          required: true
        - label: This is not a private security report; security issues will be reported using SECURITY.md.
          required: true
