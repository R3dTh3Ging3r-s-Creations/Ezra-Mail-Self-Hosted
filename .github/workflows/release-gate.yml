name: Release gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: "true"
      EZRA_AUTH_ALLOW_UNCONFIGURED: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/apply-dependency-patches.mjs
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - name: Run browser tests in pinned Playwright image
        run: |
          docker run --rm --init --ipc=host --network=host \
            --env CI=true \
            --env HOME=/tmp \
            --volume "$GITHUB_WORKSPACE:/source:ro" \
            mcr.microsoft.com/playwright:v1.60.0-noble@sha256:9bd26ad900bb5e0f4dee75839e957a89ae89c2b7ab1e76050e559790e946b948 \
            bash -lc 'mkdir /work && tar --exclude=node_modules --exclude=.next --exclude=test-results --exclude=playwright-report -C /source -cf - . | tar -C /work -xf - && cd /work && npm ci --ignore-scripts && node scripts/apply-dependency-patches.mjs && npm run build && npm run test:e2e'
      - run: npm audit --audit-level=high
      - run: npm run license:check
      - run: npm run public:scan
